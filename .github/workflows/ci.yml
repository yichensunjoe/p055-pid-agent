name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      - name: Ruff
        shell: bash
        run: |
          mkdir -p backend/test-results
          set -o pipefail
          ruff check backend 2>&1 | tee backend/test-results/ruff.txt

      - name: Offline quality harness
        run: pid-agent quality-harness

      - name: Pytest
        run: pytest -q --junitxml=backend/test-results/pytest.xml

      - name: Upload backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/test-results/ruff.txt
            backend/test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  repair-benchmark:
    name: M5 self-repair · 72-case deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      # The development suite runs first because a failure there names its own family, which
      # makes the acceptance failure that follows readable.
      - name: Development suite
        shell: bash
        run: |
          mkdir -p backend/test-results
          set -o pipefail
          pid-agent repair-benchmark --suite dev --candidate-sha "${{ github.sha }}" | \
            tee backend/test-results/repair-benchmark-dev.json

      # The case set derives from this SHA, so the evidence is about *this* commit and cannot be
      # reused by the next one. The command exits 2 when a threshold is missed or when the
      # published payload does not recompute, which is what makes the job a gate.
      - name: Acceptance suite · 72 cases
        shell: bash
        run: |
          set -o pipefail
          pid-agent repair-benchmark \
            --suite acceptance \
            --candidate-sha "${{ github.sha }}" \
            --output backend/test-results/repair-benchmark-acceptance.json | \
            tee backend/test-results/repair-benchmark-summary.json

      # §G fixes five deterministic cases on a large drawing. CI has no private drawing, so the
      # synthetic large drawing is used here; the real-file run is part of the local acceptance
      # evidence, where the drawing exists and its SHA-256 can be recorded.
      - name: Scale track · 5 cases on the large synthetic drawing
        shell: bash
        run: |
          set -o pipefail
          pid-agent repair-scale \
            --candidate-sha "${{ github.sha }}" \
            --output backend/test-results/repair-scale.json > /dev/null

      # The coverage ledger is no longer a side experiment: after the four representable codes were
      # promoted into the frozen corpus, `repair-coverage` is the executable assertion that they are
      # still carried by it, and that the three codes recorded as unreachable still cannot be staged
      # by any supported surface. Its exit code is the gate: a reverted promotion, an operator
      # dropping out of the rotation, or a code that quietly became reachable exits non-zero.
      - name: Coverage ledger · promoted codes and unreachable dispositions
        shell: bash
        run: |
          pid-agent repair-coverage \
            --output backend/test-results/repair-coverage.json \
            > /dev/null

      # §A4: a missing credential must be reported as such, never as a pass and never as a
      # failed candidate. The step therefore asserts exit code 3 specifically.
      - name: Real-model qualification · awaiting credential
        shell: bash
        run: |
          set -o pipefail
          set +e
          pid-agent repair-qualification --candidate-sha "${{ github.sha }}" \
            --output backend/test-results/repair-qualification.json \
            > backend/test-results/repair-qualification-summary.json
          status=$?
          if [ "$status" -ne 3 ]; then
            echo "expected 'awaiting credential' (exit 3), got exit $status"
            exit 1
          fi

      - name: Upload self-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/test-results/repair-benchmark-acceptance.json
            backend/test-results/repair-benchmark-summary.json
            backend/test-results/repair-benchmark-dev.json
            backend/test-results/repair-coverage.json
            backend/test-results/repair-scale.json
            backend/test-results/repair-qualification.json
            backend/test-results/repair-qualification-summary.json
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test connector routing
        run: npm test

      - name: Build
        run: npm run build

  playwright:
    name: Browser acceptance · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PID_AGENT_LLM_API_KEY: ""
      PID_AGENT_LLM_BASE_URL: ""
      PID_AGENT_LLM_MODEL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium, runtime dependencies and deterministic fonts
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes fonts-noto-cjk

      - name: Build deterministic E2E frontend
        working-directory: frontend
        run: npm run build:e2e

      - name: Run local-mode browser acceptance
        working-directory: frontend
        run: npx playwright test

      - name: Run shared-mode security acceptance
        working-directory: frontend
        run: npx playwright test --config playwright.shared.config.ts

      - name: Verify browser artifacts contain no test credentials
        working-directory: frontend
        run: npm run test:e2e:secrets

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/playwright
            frontend/test-results/playwright-report
            frontend/test-results/shared-playwright
            frontend/test-results/shared-playwright-report
            frontend/test-results/*.diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
