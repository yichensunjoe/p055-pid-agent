name: Visual baselines

# Regenerates the Playwright screenshot baselines **in the renderer that verifies them**.
#
# The committed baselines were captured on macOS while CI renders on Linux, and the declared
# UI font stack resolves to different physical fonts on the two systems, so text-dense pages
# drift by a fraction of a percent of pixels. `docs/browser-e2e-visual-acceptance.md` therefore
# says two things that this workflow exists to satisfy: never "fix" a red snapshot by updating
# it on a macOS workstation, and regenerate the whole set in the CI renderer as its own
# deliberate change.
#
# This job runs the same setup steps as `Browser acceptance · Chromium` and then updates the
# snapshots instead of asserting them. It uploads them as an artifact and commits nothing:
# reviewing the rendered images is the point, so the diff has to be looked at before it lands.
#
# The update step is a real gate. `--update-snapshots` rewrites the expected images, so the
# pixel *assertions* are expected to pass; a browser that fails to launch, a server that fails
# to start or a test that throws must still fail this job. Masking those (`|| true`) would let
# this workflow publish "green" baselines from a run that produced no screenshots at all.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update visual baselines on the CI renderer
    # Pinned on purpose. A baseline is only meaningful next to the renderer that produced
    # it, so this job must not silently move to a new Ubuntu (and a new browser/font stack)
    # and regenerate a whole set of images under a changed environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      # The suite must never reach a real provider; the same empty configuration CI uses.
      PID_AGENT_LLM_API_KEY: ""
      PID_AGENT_LLM_BASE_URL: ""
      PID_AGENT_LLM_MODEL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record the renderer environment the baselines belong to
        run: |
          echo "runner: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium, runtime dependencies and deterministic fonts
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes fonts-noto-cjk

      - name: Build deterministic E2E frontend
        working-directory: frontend
        run: npm run build:e2e

      # Proof that the update step really ran, without pretending a clean run must produce
      # a diff.
      #
      # Two earlier attempts at this check were both wrong, in opposite directions:
      #
      #   * a wall-clock window (`find ... -newermt '-30 minutes'`) passes on a fresh
      #     checkout, because git writes every committed PNG's mtime and the job counts
      #     images it never touched;
      #   * a marker ("at least one PNG is newer than the marker") fails on a correct
      #     no-drift run, because Playwright only rewrites snapshots that actually differ.
      #
      # So the job creates the change it needs to observe: one committed baseline is
      # removed, and the update step must recreate it. A *missing* snapshot is written
      # unconditionally, which is what makes this a proof rather than a coincidence.
      # (Replacing the file with a deliberately different image does not work: Playwright
      # refuses to update when the dimensions differ, so the job would fail on the very
      # no-drift case it is supposed to handle.)
      #
      # That is a real proof that the update command ran in this environment and was able
      # to write baselines, and it goes one step further: the recreated file is compared
      # with the committed bytes, so "the renderer still reproduces the committed baseline
      # exactly" is evidence this job reports instead of an assumption.
      - name: Sentinel a baseline so the update step has something to prove
        working-directory: frontend
        run: |
          sentinel=$(find e2e/visual.spec.ts-snapshots -name '*.png' | sort | head -1)
          test -n "$sentinel"
          cp "$sentinel" "$RUNNER_TEMP/sentinel-committed.png"
          echo "SENTINEL=$sentinel" >> "$GITHUB_ENV"
          echo "sentinel: $sentinel (removed; the update step must recreate it)"
          rm "$sentinel"
          touch "$RUNNER_TEMP/visual-baseline-marker"

      # Writes the new PNGs in place. The pixel *assertions* are expected to pass (every
      # drifted snapshot is rewritten on purpose), and everything else must be a failure:
      # no `|| true` here, so a browser/server/test failure fails the job instead of
      # producing a green artifact that contains no usable baselines.
      - name: Update snapshots
        working-directory: frontend
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Prove the update step recreated the sentinel baseline
        working-directory: frontend
        run: |
          test -f "$SENTINEL"
          if ! test "$SENTINEL" -nt "$RUNNER_TEMP/visual-baseline-marker"; then
            echo "::error::$SENTINEL was not recreated by the update step: the update command did not run, or could not write baselines"
            exit 1
          fi
          if cmp -s "$SENTINEL" "$RUNNER_TEMP/sentinel-committed.png"; then
            echo "$SENTINEL: recreated byte-for-byte identical to the committed baseline (this renderer reproduces it exactly)"
          else
            echo "::warning::$SENTINEL differs from the committed baseline on this renderer; the uploaded artifact contains the regenerated set"
          fi

      - name: Record what changed
        working-directory: frontend
        run: |
          git status --short e2e/visual.spec.ts-snapshots
          git diff --stat e2e/visual.spec.ts-snapshots || true

      - name: Upload updated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: frontend/e2e/visual.spec.ts-snapshots/
          retention-days: 14
